services:
  backend:
    build: backend/docker/development
    command: sh -c "composer install && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "28000:8000"
    volumes:
      - ./backend:/app
      - ./.acutis:/root/.acutis

  frontend:
    build: frontend/docker/development
    command: sh -c "pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      NUXT_API_URL: http://backend:8000
      NUXT_PUBLIC_WEBDRIVER_URL: ${NUXT_PUBLIC_WEBDRIVER_URL:-http://localhost:24000}
    ports:
      - "23000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  webdriver:
    build: webdriver/docker/development
    entrypoint: /app/docker/development/entrypoint.sh
    env_file:
      - path: webdriver/.env
        required: false
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:23000}
      WEBDRIVER_TEST_MODE: "1"
    init: true
    ports:
      - "24000:4000"
    volumes:
      - ./webdriver:/app
      - webdriver_node_modules:/app/node_modules
      - ./.acutis:/root/.acutis

volumes:
  frontend_node_modules:
  webdriver_node_modules:

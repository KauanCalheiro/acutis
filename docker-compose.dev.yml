name: acutis

services:
  frontend:
    build: frontend/docker/development
    entrypoint: /app/docker/development/entrypoint.sh
    command: sh -c "pnpm install && pnpm dev --host 0.0.0.0"
    environment:
      NUXT_API_ACUTIS_URL: http://backend:4000
      NUXT_PUBLIC_WEBDRIVER_ACUTIS_URL: ${NUXT_PUBLIC_WEBDRIVER_ACUTIS_URL:-http://localhost:24000}
    ports:
      - "23000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  # Gravador, runner e a API `/api/v1` — os três no mesmo processo desde a migração para Node.
  backend:
    build: backend/docker/development
    entrypoint: /app/docker/development/entrypoint.sh
    env_file:
      - path: backend/.env
        required: false
    environment:
      # A raiz vista do host, para os links `vscode://file/` abrirem no editor de fora do container.
      # Morava no serviço do Laravel; veio junto com a API.
      ACUTIS_PROJECTS_HOST_PATH: ${ACUTIS_PROJECTS_HOST_PATH:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:23000}
      WEBDRIVER_TEST_MODE: "1"
      RECORDER_CDP_URL: ${RECORDER_CDP_URL:-http://host.docker.internal:9222}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    ports:
      - "24000:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - ./.acutis:/home/dev/.acutis

volumes:
  frontend_node_modules:
  backend_node_modules:

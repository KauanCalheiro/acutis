name: acutis

services:
  # No Linux o backend roda na rede do host, então o nome de serviço deixa de resolvê-lo: quem
  # falava com ele pelo nome passa a falar pelo gateway. Antes era o Laravel; agora é o frontend,
  # que herdou a chamada à API.
  frontend:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NUXT_API_ACUTIS_URL: http://host.docker.internal:24000

  backend:
    network_mode: host
    ports: !reset []
    environment:
      PORT: "24000"
      RECORDER_CDP_URL: http://127.0.0.1:9222

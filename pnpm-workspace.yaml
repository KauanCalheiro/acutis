packages:
  - backend
  - contracts
  - e2e
  - frontend

# Fusão dos dois arquivos que existiam por app. Onde eles discordavam — `esbuild` — vale o `true` do
# backend: o `vite build` da UI injetável precisa do binário; o frontend passa sem ele porque o Nuxt
# usa o esbuild que vem no bundle do vite dele.
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@swc/core': true
  '@tailwindcss/oxide': false
  better-sqlite3: true
  esbuild: true
  unrs-resolver: false
  vue-demi: false

# Os pacotes de binário do `@openai/codex-sdk`, 262 MB por plataforma. O provedor Codex roda o
# `codex` instalado na máquina.
ignoredOptionalDependencies:
  - '@openai/codex-darwin-arm64'
  - '@openai/codex-darwin-x64'
  - '@openai/codex-linux-arm64'
  - '@openai/codex-linux-x64'
  - '@openai/codex-win32-arm64'
  - '@openai/codex-win32-x64'
